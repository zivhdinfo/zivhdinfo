name: pulse

on:
  schedule:
    # Lệch khỏi phút 0: đúng đầu giờ là lúc hàng đợi Actions đông nhất và lịch
    # chạy hay bị trễ hàng chục phút. Phút lẻ thì chạy sát giờ hơn nhiều.
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update pulse line
        run: node .github/scripts/pulse.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Lấy lịch sử contribution rồi dựng lại SVG để hạt đậu trong màn pacman
      # đúng màu. Nguồn chính là github-contributions-api.jogruber.de, hỏng thì
      # tự lùi về đọc trang public của GitHub. Chỉ dựng lại khi dữ liệu thật sự
      # đổi — header.svg to, không nên commit lại mỗi 6 tiếng dù chẳng có gì mới.
      - name: Refresh contributions
        run: node .github/scripts/contributions.mjs

      - name: Rebuild assets if contributions changed
        run: |
          # Dùng `git status --porcelain` chứ không phải `git diff`: lần chạy đầu
          # file còn untracked, mà untracked thì không nằm trong diff nên
          # `git diff --quiet` báo "không đổi" và bỏ qua mất bước dựng lại.
          if [ -z "$(git status --porcelain -- tools/contributions.json)" ]; then
            echo "Lịch sử contribution không đổi, bỏ qua bước dựng lại."
          else
            node tools/build-assets.mjs
          fi

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md tools/contributions.json assets
          if git diff --cached --quiet; then
            echo "Không có thay đổi, bỏ qua commit."
          else
            git commit -m "chore(pulse): refresh status line and contribution colours"
            # Nhánh có thể đã nhích lên kể từ lúc checkout; rebase rồi hẵng đẩy,
            # không thì cả lần chạy này mất trắng vì push bị từ chối.
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
